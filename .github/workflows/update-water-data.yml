name: Update Copenhagen Water Data

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-water-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch Open-Meteo water data
        run: node scripts/update-water-data.js

      - name: Commit updated data
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add data/water-report.json data/last-update.json

          if git diff --cached --quiet; then
            echo "No data changes to commit"
          else
            git commit -m "Update Copenhagen water data"
            git push
          fi
